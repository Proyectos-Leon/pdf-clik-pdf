<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Click PDF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Herramientas gratis y privadas para PDF, Word, Excel e imágenes: unir, dividir, comprimir, convertir, OCR, firmar, proteger y más. Todo se procesa en tu dispositivo.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: barra superior, portada corta con buscador, filtros por categoría y cuadrícula de herramientas; cada herramienta abre su propio panel. */
:root{
  --paper:#f2f4f8;--card:#ffffff;--ink:#11141c;--mute:#596174;--line:#dce0ea;
  --accent:#2240f2;--accent-ink:#ffffff;--accent-soft:#e5e9ff;--ok:#0f7a4b;--err:#b42318;--warnbg:#fff4e0;--warn:#8a4b00;
  --c-org:#2240f2;--c-opt:#0b8668;--c-to:#c2410c;--c-from:#a1365c;--c-edit:#6a3dd1;--c-sec:#3a4a63;--c-ai:#0a7590;
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1016;--card:#171a23;--ink:#eef0f6;--mute:#9aa2b5;--line:#2a2f3c;
  --accent:#8196ff;--accent-ink:#0a0f2e;--accent-soft:#1d2447;--ok:#4fd39a;--err:#ff8d80;--warnbg:#33260f;--warn:#ffc46b;
  --c-org:#8a9cff;--c-opt:#3dcfa6;--c-to:#ff9a5c;--c-from:#f08cb0;--c-edit:#b69bff;--c-sec:#a8b5cb;--c-ai:#52c9e4;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1016;--card:#171a23;--ink:#eef0f6;--mute:#9aa2b5;--line:#2a2f3c;
  --accent:#8196ff;--accent-ink:#0a0f2e;--accent-soft:#1d2447;--ok:#4fd39a;--err:#ff8d80;--warnbg:#33260f;--warn:#ffc46b;
  --c-org:#8a9cff;--c-opt:#3dcfa6;--c-to:#ff9a5c;--c-from:#f08cb0;--c-edit:#b69bff;--c-sec:#a8b5cb;--c-ai:#52c9e4;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font:16px/1.55 var(--f-body)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--f-disp);letter-spacing:-.02em;text-decoration:none;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.logo b{color:var(--accent)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.mark svg{width:18px;height:18px}
.pill{font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:5px 12px;background:var(--card)}
body{background:radial-gradient(900px 620px at 8% -8%,color-mix(in srgb,var(--accent) 20%,transparent),transparent 62%),radial-gradient(760px 560px at 100% 6%,color-mix(in srgb,var(--c-to) 15%,transparent),transparent 60%),radial-gradient(900px 700px at 60% 112%,color-mix(in srgb,var(--c-opt) 14%,transparent),transparent 62%),radial-gradient(color-mix(in srgb,var(--ink) 6%,transparent) 1px,transparent 1.3px),var(--paper);background-size:100% 100%,100% 100%,100% 100%,24px 24px,auto;background-attachment:fixed}
.panel,.tool,.how div,.search input,.chip,.pill{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.panel{box-shadow:0 1px 0 color-mix(in srgb,#fff 60%,transparent) inset,0 24px 48px -32px color-mix(in srgb,var(--ink) 45%,transparent)}
.tool{box-shadow:0 1px 0 color-mix(in srgb,#fff 55%,transparent) inset,0 10px 26px -22px color-mix(in srgb,var(--ink) 50%,transparent)}
.hero h1{background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 78%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 em{color:var(--accent);-webkit-text-fill-color:var(--accent)}
.hero{padding-block:30px 26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:36px;align-items:center}
.hero-txt{display:grid;gap:18px;min-width:0}
.eyebrow{justify-self:start;font:700 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:7px 10px;border-radius:99px}
.hero h1{font:800 clamp(34px,5.6vw,60px)/1.0 var(--f-disp);letter-spacing:-.035em;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;left:0;right:0;bottom:.04em;height:.16em;background:color-mix(in srgb,var(--accent) 22%,transparent);border-radius:4px;z-index:-1}
.hero p{margin:0;color:var(--mute);font-size:18px;max-width:56ch}
.search{position:relative;max-width:540px}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:0 8px 24px -16px color-mix(in srgb,var(--ink) 40%,transparent);font-size:16px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mute)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:4px}
.stats div{display:grid;gap:2px}
.stats b{font:800 26px/1 var(--f-disp);letter-spacing:-.02em}
.stats span{font-size:13px;color:var(--mute)}
.stack{position:relative;height:300px}
.sheet{position:absolute;width:62%;aspect-ratio:1/1.3;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;align-content:start;gap:8px;box-shadow:0 22px 44px -24px color-mix(in srgb,var(--ink) 55%,transparent)}
.sheet i{display:block;height:7px;border-radius:4px;background:var(--line)}
.sheet i.t{height:11px;width:60%;background:var(--ink);opacity:.8}
.sheet i.s{width:70%}.sheet i.m{width:85%}
.sheet .tagf{justify-self:start;font:700 11px/1 var(--f-mono);padding:5px 7px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.s1{--c:var(--c-to);left:4%;top:12%;transform:rotate(-8deg)}
.s2{--c:var(--c-opt);left:22%;top:4%;transform:rotate(3deg)}
.s3{--c:var(--c-org);left:36%;top:16%;transform:rotate(10deg)}
.cursor{position:absolute;right:6%;bottom:6%;width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 18%,transparent),0 0 0 22px color-mix(in srgb,var(--accent) 8%,transparent);animation:pulse 2.4s ease-in-out infinite}
.cursor svg{width:24px;height:24px}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 14%,transparent),0 0 0 30px color-mix(in srgb,var(--accent) 4%,transparent)}}
@media (max-width:820px){.hero{grid-template-columns:1fr}.stack{display:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:8px 22px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:10px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 15px;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sect{display:grid;gap:14px;margin-bottom:34px}
.sect h2{display:flex;align-items:center;gap:10px;margin:0;font:700 21px/1.2 var(--f-disp);letter-spacing:-.015em}
.sect h2 .dot{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sect h2 small{font:500 13px var(--f-mono);color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tool{--c:var(--c-org);position:relative;display:grid;grid-template-rows:auto auto 1fr;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:border-color .18s,transform .18s,box-shadow .18s;overflow:hidden}
.tool::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.tool:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line));transform:translateY(-3px);box-shadow:0 16px 34px -20px color-mix(in srgb,var(--c) 70%,transparent)}
.tool:hover::before{transform:scaleX(1)}
.tool[aria-disabled="true"]{cursor:default;opacity:.55}
.tool[aria-disabled="true"]:hover{transform:none;border-color:var(--line);box-shadow:none}
.tool[aria-disabled="true"]:hover::before{transform:scaleX(0)}
.tool .tt{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.ico svg{width:22px;height:22px}
.tool .badge{font-size:10.5px;padding:5px 7px}
.tool h3{margin:4px 0 0;font:650 17.5px/1.25 var(--f-disp);letter-spacing:-.01em}
.tool p{margin:0;font-size:14px;color:var(--mute)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:10px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:6px}
.how b{font:800 13px/1 var(--f-mono);color:var(--accent)}
.how h4{margin:0;font:700 17px var(--f-disp)}
.how p{margin:0;font-size:14px;color:var(--mute)}
.vhead{grid-template-columns:auto 1fr;align-items:center;column-gap:16px}
.vhead .ico{width:60px;height:60px;border-radius:16px;grid-row:span 2}
.vhead .ico svg{width:30px;height:30px}
.badge{--c:var(--c-org);display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 var(--f-mono);letter-spacing:.04em;padding:6px 8px;border-radius:7px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.tag{font:600 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--line);color:var(--mute);margin-left:6px}
.cat-org{--c:var(--c-org)}.cat-opt{--c:var(--c-opt)}.cat-to{--c:var(--c-to)}.cat-from{--c:var(--c-from)}.cat-edit{--c:var(--c-edit)}.cat-sec{--c:var(--c-sec)}.cat-ai{--c:var(--c-ai)}
.empty{color:var(--mute);padding:24px 0}
.view{max-width:820px;display:grid;gap:16px;padding-top:6px}
.back{justify-self:start;background:none;border:0;color:var(--mute);cursor:pointer;padding:4px 0;font-size:15px}
.back:hover{color:var(--ink)}
.vhead{display:grid;gap:8px}
.vhead h2{margin:0;font:800 clamp(26px,4vw,38px)/1.08 var(--f-disp);letter-spacing:-.025em}
.vhead p{margin:0;color:var(--mute);max-width:62ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;min-width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:10px;justify-items:center;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop small{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:12px 20px;font-weight:600;cursor:pointer}
.btn.big{padding:15px 26px;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.files li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.files .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .s{font:500 12px var(--f-mono);color:var(--mute)}
.ib{width:34px;height:34px;flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer}
.opts{display:grid;gap:12px}
.opts:empty{display:none}
.fld{display:grid;gap:6px;font-size:14px;font-weight:600}
.fld input[type=text],.fld input[type=password],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-weight:400}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.fld{flex:1 1 160px}
.check{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.hint{margin:0;font-size:14px;color:var(--mute)}
.note{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn)}
.act{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{display:grid;gap:6px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.prog span{font-size:14px;color:var(--mute)}
.msg{font-size:15px}
.msg.err{color:var(--err)}
.res{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.res h3{margin:0;font:700 20px var(--f-disp);color:var(--ok)}
.outs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.outs li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.outs .n{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.outs .s{font:500 12px var(--f-mono);color:var(--mute)}
.summary{margin:0;padding-left:18px;font-size:15px}
.textout{width:100%;min-height:220px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font:14px/1.5 var(--f-mono);resize:vertical}
.diff{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;font:13px/1.5 var(--f-mono)}
.diff div{padding:2px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .add{background:color-mix(in srgb,var(--ok) 16%,transparent)}
.diff .del{background:color-mix(in srgb,var(--err) 16%,transparent);text-decoration:line-through;text-decoration-thickness:1px}
.diff .gap{color:var(--mute);font-style:italic}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.th{display:grid;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--paper)}
.th canvas{width:100%;height:auto;background:#fff;border-radius:4px;transition:transform .2s}
.th .tb{display:flex;justify-content:space-between;gap:4px}
.th .tb button{flex:1;height:30px;border:1px solid var(--line);background:var(--card);border-radius:6px;cursor:pointer;padding:0}
.th small{font:500 12px var(--f-mono);color:var(--mute);text-align:center}
.pad{width:100%;max-width:560px;aspect-ratio:3/1;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;cursor:crosshair}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;color:var(--mute);font-size:14px}
.det{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.det-t{flex:1 1 240px;display:grid;gap:6px;min-width:0}
.det-t h4{margin:0;font:700 21px/1.2 var(--f-disp)}
.gauge{--p:0;--g:var(--ok);width:136px;height:136px;flex:none;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.gauge span{width:106px;height:106px;border-radius:50%;background:var(--card);display:grid;place-content:center;justify-items:center;gap:3px}
.gauge span b{font:800 32px/1 var(--f-disp);color:var(--g)}
.gauge span small{font:600 12px/1 var(--f-body);color:var(--mute)}
.verdict{margin:0;font-size:16px}
.verdict b{font-family:var(--f-disp)}
.gauge.mid{--g:var(--c-to)}.gauge.hi{--g:var(--err)}
.paras{display:grid;gap:8px;max-height:520px;overflow:auto}
.pp{padding:10px 12px;border-radius:10px;border-left:4px solid var(--line);background:var(--paper);font-size:14px;overflow-wrap:anywhere}
.pp.lo{border-left-color:var(--ok)}
.pp.mid{border-left-color:var(--c-to);background:color-mix(in srgb,var(--c-to) 9%,var(--paper))}
.pp.hi{border-left-color:var(--err);background:color-mix(in srgb,var(--err) 10%,var(--paper))}
.pp b{font:700 12px var(--f-mono);margin-right:8px}
.docprev{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:10px;padding:28px 30px;max-height:520px;overflow:auto;font:15px/1.5 Calibri,Arial,sans-serif;box-shadow:0 10px 30px -20px rgba(0,0,0,.4)}
.docprev h1{font-size:22px;margin:.4em 0}.docprev h2{font-size:18px;margin:.5em 0}.docprev h3{font-size:16px}
.docprev p{margin:.45em 0}.docprev table{border-collapse:collapse;width:100%;margin:.6em 0;font-size:14px}.docprev td,.docprev th{border:1px solid #888;padding:4px 7px;vertical-align:top}.docprev th{background:#f0f0f0}
.stage{position:relative;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.stage img{display:block;width:100%;height:auto}
.tline{position:absolute;box-sizing:border-box;margin:0;padding:0 1px;border:1px dashed color-mix(in srgb,#2240f2 45%,transparent);background:transparent;color:transparent;caret-color:#e11d48;font-family:Arial,Helvetica,sans-serif;line-height:1;border-radius:2px;cursor:text;min-width:0}
.tline:hover{background:rgba(34,64,242,.08)}
.tline:focus{border:1px solid #2240f2;background:rgba(255,255,255,.95);color:#111;outline:none;z-index:2}
.tline.chg{background:#fff4a8;color:#111;border:1px solid #c99a06}
.edprev{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <button class="logo" id="home" aria-label="Click PDF, inicio">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l5 15 2.5-6.5L19 9z"/><path d="M13 13l6 6"/></svg></span>
      <span><b>Click</b> PDF</span>
    </button>
    <span class="pill">🔒 Tus archivos no salen de tu dispositivo</span>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <span>Click PDF · Herramientas PDF gratis</span>
    <span id="toolcount"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>

const LIB={
  pdfjs:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",

{id:"editar-imagen",cat:"edit",b:"TEXTO",n:"Editar texto de una imagen",d:"Sube una foto o captura, toca cualquier texto y cámbialo encima de la imagen, sin Photoshop.",acc:"img",go:"Guardar imagen editada",
